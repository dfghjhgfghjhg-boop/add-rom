<!DOCTYPE html>
<html>
<head>
    <title>GB Emulator</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { background: #222; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { background: #000; width: 320px; height: 288px; }
    </style>
</head>
<body>
    <h3>Game Boy Player</h3>
    <input type="file" id="loader" accept=".gb,.gbc"><br><br>
    <canvas id="canvas"></canvas>

    <script>
        const loader = document.getElementById('loader');
        const canvas = document.getElementById('canvas');
        
        // Initialize WasmBoy
        WasmBoy.config({ LCD: { targetCanvas: canvas } });

        loader.addEventListener('change', (event) => {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const romArrayBuffer = e.target.result;
                WasmBoy.loadRom(romArrayBuffer).then(() => WasmBoy.play());
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
